spring:
  config:
    activate:
      on-profile: test
  custom-datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

app:
  kafka:
    topics:
      workload-events: trainer.workload.events

hibernate:
  hbm2ddl:
    auto: create-drop
  highlight_sql: false

logging:
  level:
    root: info
    org.springframework.security: info